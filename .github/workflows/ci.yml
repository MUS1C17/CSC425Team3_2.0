name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  lint_unit:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speakup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: speakup/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --silent
      - name: Unit tests
        run: npm test --silent

  e2e:
    name: Cypress E2E
    needs: lint_unit
    # Enable by setting repository variable RUN_E2E=1
    if: ${{ vars.RUN_E2E == '1' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: speakup/package-lock.json
      - name: Install deps
        working-directory: speakup
        run: npm ci
      - name: Build
        working-directory: speakup
        run: npm run build
      - name: Run Cypress against Next start
        uses: cypress-io/github-action@v6
        with:
          working-directory: speakup
          start: npx next start -p 3000
          wait-on: 'http://localhost:3000'
          browser: chrome
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY }}

